    verturin.chastitytracker.tables.chastity_streak_milestones: '%core.table_prefix%chastity_streak_milestones'
    verturin.chastitytracker.tables.chastity_total_milestones: '%core.table_prefix%chastity_total_milestones'
    verturin.chastitytracker.tables.chastity_contract_articles: '%core.table_prefix%chastity_contract_articles'
    verturin.chastitytracker.tables.chastity_contracts: '%core.table_prefix%chastity_contracts'
    verturin.chastitytracker.tables.chastity_contract_links: '%core.table_prefix%chastity_contract_links'
    verturin.chastitytracker.tables.chastity_contract_categories: '%core.table_prefix%chastity_contract_categories'
